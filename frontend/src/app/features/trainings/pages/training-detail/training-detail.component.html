@if (training(); as item) {
  <main class="training-detail">
    <a routerLink="/trainings">Retour aux formations</a>

    <header class="training-detail__header">
      <div>
        <h1>{{ item.title }}</h1>
        <p>{{ item.description }}</p>
      </div>
      <app-status-badge
        [label]="statusConfig().label"
        [status]="statusConfig().variant"
      />
    </header>

    <dl class="training-detail__information">
      <dt>Mode</dt>
      <dd>{{ modeLabel() }}</dd>
      <dt>Date de début</dt>
      <dd>{{ item.startDate | date }}</dd>
      <dt>Date de fin</dt>
      <dd>{{ item.endDate | date }}</dd>
    </dl>

    @if (publicApplyUrl()) {
      <button type="button" (click)="copyLink()">
        {{ copied() ? 'Lien copié' : 'Copier le lien de candidature' }}
      </button>
    }
  </main>
} @else {
  <p>Chargement de la formation…</p>
}
