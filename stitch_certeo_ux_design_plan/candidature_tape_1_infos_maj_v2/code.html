<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-start md:justify-center p-4">
<!-- Mobile Container (Max width for mobile simulation on desktop) -->
<div class="w-full max-w-[400px] flex flex-col bg-surface-container-lowest rounded-xl soft-tech-shadow overflow-hidden relative">
<!-- Header (TopAppBar equivalent for transactional flow) -->
<header class="flex justify-center items-center px-4 h-16 bg-surface border-b border-outline-variant/30">
<img alt="CERTEO" class="h-8 object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDFyOaQ8OjaSNka_Dn-CVTu47lI6MiabEBwvOnmXo8J28eyh-QSjcYVxY76sZ05rg5D0nHZEwGTXtneLHqGk6nnwbGrfBGxT6ZbmOrIYd_UNi7KDC_A57z8xxHuh_XlBQMrrfhHIk_bsG-cY7_k51MkAk6nP8maFJAE2b-OFtxm3dXB5zzrIgjLq55YTtRGxYenvoWaCqP4CMjSqDarIF43TnDgj9ZJOjlv37DXoo3lRpat8Ej1LisP_vhGCNRAQTl0Ew">
</header>
<!-- Main Content Area -->
<main class="flex-1 overflow-y-auto p-margin-mobile flex flex-col gap-6 pb-24">
<!-- Stepper -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-end gap-4">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-primary break-words">Informations Personnelles</h2>
<span class="font-label-md text-label-md text-on-surface-variant whitespace-nowrap mb-1">1 / 4</span>
</div>
<!-- Progress Bar -->
<div class="w-full flex gap-2">
<div class="h-2 flex-1 bg-primary-container rounded-full"></div>
<div class="h-2 flex-1 bg-surface-variant rounded-full"></div>
<div class="h-2 flex-1 bg-surface-variant rounded-full"></div>
<div class="h-2 flex-1 bg-surface-variant rounded-full"></div>
</div>
</div>
<!-- Form -->
<form class="flex flex-col gap-4">
<!-- Input: Nom complet -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface" for="fullName">Nom complet</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">person</span>
<input class="w-full pl-10 pr-4 py-3 rounded-lg border border-outline-variant bg-surface focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50" id="fullName" placeholder="Jean Dupont" type="text">
</div>
</div>
<!-- Input: Email -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">mail</span>
<input class="w-full pl-10 pr-4 py-3 rounded-lg border border-outline-variant bg-surface focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50" id="email" placeholder="jean.dupont@exemple.com" type="email">
</div>
</div>
<!-- Input: Numéro de téléphone -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface" for="phone">Numéro de téléphone</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">call</span>
<input class="w-full pl-10 pr-4 py-3 rounded-lg border border-outline-variant bg-surface focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50" id="phone" placeholder="+33 6 12 34 56 78" type="tel">
</div>
</div>
<!-- Input: Ville de résidence -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface" for="city">Ville de résidence</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">location_on</span>
<input class="w-full pl-10 pr-4 py-3 rounded-lg border border-outline-variant bg-surface focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50" id="city" placeholder="Paris, France" type="text">
</div>
</div>
</form>
</main>
<!-- Fixed Bottom Action Area -->
<div class="absolute bottom-0 left-0 w-full p-4 bg-surface-container-lowest border-t border-outline-variant/30 flex justify-between gap-4">
<button class="bg-surface border border-primary-container text-primary-container hover:bg-primary-fixed hover:text-on-primary-container font-label-md text-label-md py-3 px-6 rounded-lg min-h-[48px] flex items-center justify-center gap-2 transition-colors w-full sm:w-1/2">
                Précédent
</button>
<button class="bg-primary-container hover:opacity-90 text-[#ffffff] font-label-md text-label-md py-3 px-6 rounded-lg min-h-[48px] flex items-center justify-center gap-2 transition-opacity w-full sm:w-1/2">
                Suivant
                <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
</div>
</div>
</body></html>
