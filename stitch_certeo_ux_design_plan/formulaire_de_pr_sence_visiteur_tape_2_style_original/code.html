<script>
        // Simple script to handle radio button visual state (mostly handled by CSS, but adds a bit of robust fallback if needed)
        document.querySelectorAll('input[name="formation"]').forEach(radio => {
            radio.addEventListener('change', function() {
                // Remove highlight from all
                document.querySelectorAll('.formation-radio + div').forEach(div => {
                    div.style.borderColor = '';
                });
                document.querySelectorAll('.radio-outer').forEach(div => {
                    div.style.borderColor = '';
                });
