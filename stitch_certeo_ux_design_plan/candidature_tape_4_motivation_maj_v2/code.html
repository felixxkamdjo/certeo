<form class="flex flex-col gap-gutter flex-grow">
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface" for="motivation">Pourquoi souhaitez-vous rejoindre cette formation ?</label>
<textarea class="w-full rounded-DEFAULT border border-outline-variant bg-surface-container-lowest text-on-surface p-3 focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-colors" id="motivation" name="motivation" placeholder="Exprimez votre motivation ici..." rows="5"></textarea>
</div>
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface" for="source">Comment avez-vous connu ODC ?</label>
<div class="relative">
<select class="w-full rounded-DEFAULT border border-outline-variant bg-surface-container-lowest text-on-surface p-3 appearance-none focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-colors" id="source" name="source">
<option disabled="" selected="" value="">Sélectionnez une option</option>
<option value="social">Réseaux sociaux</option>
<option value="friend">Ami / Connaissance</option>
<option value="event">Événement ODC</option>
<option value="other">Autre</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-on-surface-variant">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface" for="availability">Disponibilité</label>
<div class="relative">
<select class="w-full rounded-DEFAULT border border-outline-variant bg-surface-container-lowest text-on-surface p-3 appearance-none focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-colors" id="availability" name="availability">
<option disabled="" selected="" value="">Sélectionnez une option</option>
<option value="full-time">Temps plein</option>
<option value="part-time">Temps partiel</option>
<option value="evening-weekend">Soir &amp; Week-end</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-on-surface-variant">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>

</div>
<label class="font-body-md text-body-md text-on-surface-variant leading-tight" for="terms">

                </label>
