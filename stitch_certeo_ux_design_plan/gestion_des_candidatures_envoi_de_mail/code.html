<!DOCTYPE html><html class="light" lang="fr"><head>

                        "surface-container-high": "#e9e8e7",
                        "secondary-fixed": "#e2e2e2",
                        "on-error": "#ffffff",
                        "on-background": "#1b1c1c",
                        "on-secondary": "#ffffff",
                        "tertiary-fixed-dim": "#c6c6c7",
                        "tertiary-fixed": "#e2e2e2",
                        "on-error-container": "#93000a",
                        "primary-fixed-dim": "#ffb68c",
                        "secondary-container": "#e2e2e2",

                        "on-tertiary": "#ffffff",

                        "on-surface-variant": "#584235"
                    },
                    "borderRadius": {

                    "spacing": {

                    "fontFamily": {

<style>
        body { font-family: 'Hanken Grotesk', sans-serif; }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col md:flex-row">
<!-- TopAppBar (Mobile Only) -->
<header class="md:hidden flex justify-between items-center h-16 px-margin-mobile bg-surface dark:bg-surface-dim border-b border-outline-variant dark:border-outline fixed top-0 w-full z-50">
<div class="font-headline-md text-headline-md font-black text-primary dark:text-primary-container">
            CERTEO Admin
        </div>
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim cursor-pointer active:opacity-80">notifications</span>
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim cursor-pointer active:opacity-80">settings</span>
</div>
</header>
<!-- SideNavBar (Desktop Only) -->
<nav class="hidden md:flex flex-col pt-20 pb-8 px-4 w-72 bg-surface-container-low dark:bg-inverse-surface shadow-sm fixed left-0 top-0 h-full z-40">
<div class="mb-8 px-4">
<h1 class="font-headline-md text-headline-md font-bold text-on-surface dark:text-inverse-on-surface">Certeo Portal</h1>
<p class="font-label-md text-label-md text-on-surface-variant">Management Console</p>
</div>
<ul class="flex flex-col gap-2 font-label-md text-label-md">
<li>
<a class="flex items-center gap-3 px-4 py-3 rounded-lg text-on-surface-variant hover:bg-surface-container-high hover:bg-surface-container-highest transition-all active:scale-95 transition-transform" href="#">
<span class="material-symbols-outlined">dashboard</span>
                    Dashboard
                </a>
</li>
<li>
<a class="flex items-center gap-3 px-4 py-3 rounded-lg text-on-surface-variant hover:bg-surface-container-high hover:bg-surface-container-highest transition-all active:scale-95 transition-transform" href="#">
<span class="material-symbols-outlined">school</span>
                    Formations
                </a>
</li>
<li>
<a class="flex items-center gap-3 px-4 py-3 rounded-lg bg-primary-container text-on-primary-container font-bold active:scale-95 transition-transform" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">group</span>
                    Candidats
                </a>
</li>
<li>
<a class="flex items-center gap-3 px-4 py-3 rounded-lg text-on-surface-variant hover:bg-surface-container-high hover:bg-surface-container-highest transition-all active:scale-95 transition-transform" href="#">
<span class="material-symbols-outlined">badge</span>
                    Formateurs
                </a>
</li>
<li>
<a class="flex items-center gap-3 px-4 py-3 rounded-lg text-on-surface-variant hover:bg-surface-container-high hover:bg-surface-container-highest transition-all active:scale-95 transition-transform" href="#">
<span class="material-symbols-outlined">settings</span>
                    Paramètres
                </a>
</li>
</ul>
</nav>
<!-- Main Content -->
<main class="flex-1 w-full md:ml-72 pt-20 md:pt-8 px-margin-mobile md:px-margin-desktop pb-12 max-w-container-max mx-auto">
<!-- Header -->
<div class="mb-8 flex items-center justify-between">
<div>
<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface">Envoyer un Email</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">Communication avec les candidats</p>
</div>
<a class="hidden md:flex items-center gap-2 text-primary font-label-md text-label-md hover:underline" href="#">
<span class="material-symbols-outlined">arrow_back</span>
                Retour aux candidats
            </a>
</div>
<!-- Compose Email Form -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0_4px_12px_rgba(0,0,0,0.05)] p-4 md:p-gutter">
<form action="#" class="space-y-6" method="POST">
<!-- Email Type Selection -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<label class="relative flex cursor-pointer rounded-lg border bg-surface-container-lowest p-4 shadow-sm focus:outline-none border-primary ring-1 ring-primary">
<input checked="" class="sr-only" name="email_type" onchange="toggleEmailType('personnel')" type="radio" value="personnel">
<span class="flex flex-1">
<span class="flex flex-col">
<span class="block font-label-md text-label-md text-on-surface">Mail personnel</span>
<span class="mt-1 flex items-center font-body-md text-body-md text-on-surface-variant">À un candidat spécifique</span>
</span>
</span>
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</label>
<label class="relative flex cursor-pointer rounded-lg border bg-surface-container-lowest p-4 shadow-sm focus:outline-none border-outline-variant hover:bg-surface-container-low transition-colors">
<input class="sr-only" name="email_type" onchange="toggleEmailType('groupe')" type="radio" value="groupe">
<span class="flex flex-1">
<span class="flex flex-col">
<span class="block font-label-md text-label-md text-on-surface">Mail groupé</span>
<span class="mt-1 flex items-center font-body-md text-body-md text-on-surface-variant">Par statut de candidature</span>
</span>
</span>
<span class="material-symbols-outlined text-outline-variant hidden">check_circle</span>
</label>
</div>
<!-- Personnel Selection Area -->
<div class="space-y-4" id="personnel-area">
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="candidat-search">Rechercher un candidat</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">search</span>
<input class="w-full pl-10 pr-4 py-3 rounded-lg border border-outline-variant bg-surface-container-lowest focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-shadow font-body-md text-body-md" id="candidat-search" placeholder="Nom, prénom, email..." type="text">
</div>
</div>
</div>
<!-- Groupe Selection Area -->
<div class="hidden space-y-4" id="groupe-area">
<label class="font-label-md text-label-md text-on-surface">Sélectionner les destinataires par statut</label>
<div class="flex flex-wrap gap-3">
<label class="inline-flex items-center gap-2 px-4 py-2 rounded-full border border-outline-variant cursor-pointer hover:bg-surface-container-low transition-colors">
<input class="rounded text-primary focus:ring-primary border-outline-variant" type="checkbox">
<span class="font-body-md text-body-md">Tous</span>
</label>
<label class="inline-flex items-center gap-2 px-4 py-2 rounded-full border border-outline-variant cursor-pointer bg-primary-fixed/10 hover:bg-primary-fixed/20 transition-colors">
<input checked="" class="rounded text-primary focus:ring-primary border-outline-variant" type="checkbox">
<span class="font-body-md text-body-md text-primary">Sélectionné</span>
</label>
<label class="inline-flex items-center gap-2 px-4 py-2 rounded-full border border-outline-variant cursor-pointer hover:bg-surface-container-low transition-colors">
<input class="rounded text-primary focus:ring-primary border-outline-variant" type="checkbox">
<span class="font-body-md text-body-md">En attente</span>
</label>
<label class="inline-flex items-center gap-2 px-4 py-2 rounded-full border border-outline-variant cursor-pointer hover:bg-surface-container-low transition-colors">
<input class="rounded text-primary focus:ring-primary border-outline-variant" type="checkbox">
<span class="font-body-md text-body-md">Refusé</span>
</label>
<label class="inline-flex items-center gap-2 px-4 py-2 rounded-full border border-outline-variant cursor-pointer hover:bg-surface-container-low transition-colors">
<input class="rounded text-primary focus:ring-primary border-outline-variant" type="checkbox">
<span class="font-body-md text-body-md">En entretien</span>
</label>
</div>
</div>
<!-- Subject Line -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="sujet">Sujet de l'email</label>
<input class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface-container-lowest focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-shadow font-body-md text-body-md" id="sujet" placeholder="Saisissez le sujet..." type="text">
</div>
<!-- Message Body -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="message">Message</label>
<div class="border border-outline-variant rounded-lg overflow-hidden focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-shadow">
<!-- Toolbar Mockup -->
<div class="bg-surface-container-low border-b border-outline-variant px-3 py-2 flex flex-wrap gap-2">
<button class="p-1 rounded hover:bg-surface-container-high text-on-surface-variant" type="button"><span class="material-symbols-outlined text-[20px]">format_bold</span></button>
<button class="p-1 rounded hover:bg-surface-container-high text-on-surface-variant" type="button"><span class="material-symbols-outlined text-[20px]">format_italic</span></button>
<button class="p-1 rounded hover:bg-surface-container-high text-on-surface-variant" type="button"><span class="material-symbols-outlined text-[20px]">format_underlined</span></button>
<div class="w-px h-6 bg-outline-variant mx-1 self-center"></div>
<button class="p-1 rounded hover:bg-surface-container-high text-on-surface-variant" type="button"><span class="material-symbols-outlined text-[20px]">format_list_bulleted</span></button>
<button class="p-1 rounded hover:bg-surface-container-high text-on-surface-variant" type="button"><span class="material-symbols-outlined text-[20px]">format_list_numbered</span></button>
<div class="w-px h-6 bg-outline-variant mx-1 self-center"></div>
<button class="p-1 rounded hover:bg-surface-container-high text-on-surface-variant" type="button"><span class="material-symbols-outlined text-[20px]">link</span></button>
</div>
<textarea class="w-full px-4 py-3 border-none bg-surface-container-lowest focus:ring-0 outline-none resize-y font-body-md text-body-md" id="message" placeholder="Rédigez votre message ici..." rows="8"></textarea>
</div>
</div>
<!-- Actions -->
<div class="flex flex-col sm:flex-row gap-4 pt-4 border-t border-outline-variant justify-end">
<button class="px-6 py-3 min-h-[48px] font-label-md text-label-md bg-transparent border border-on-surface text-on-surface rounded-lg hover:bg-surface-container-low transition-colors" type="button">
                        Annuler
                    </button>
<button class="px-6 py-3 min-h-[48px] font-label-md text-label-md bg-primary-container text-on-primary-container rounded-lg flex justify-center items-center gap-2 hover:opacity-90 transition-opacity" type="submit">
<span class="material-symbols-outlined">send</span>
                        Envoyer l'email
                    </button>
</div>
</form>
</div>
</main>
<script>
        function toggleEmailType(type) {
            const personnelArea = document.getElementById('personnel-area');
            const groupeArea = document.getElementById('groupe-area');
            const labels = document.querySelectorAll('input[name="email_type"]');
            
            if (type === 'personnel') {
                personnelArea.classList.remove('hidden');
                groupeArea.classList.add('hidden');
            } else {
                personnelArea.classList.add('hidden');
                groupeArea.classList.remove('hidden');
            }

            // Update label styling logic
            labels.forEach(input => {
                const label = input.closest('label');
                const icon = label.querySelector('.material-symbols-outlined');
                if (input.checked) {
                    label.classList.add('border-primary', 'ring-1', 'ring-primary');
                    label.classList.remove('border-outline-variant');
                    icon.classList.remove('hidden');
                    icon.style.fontVariationSettings = "'FILL' 1";
                } else {
                    label.classList.remove('border-primary', 'ring-1', 'ring-primary');
                    label.classList.add('border-outline-variant');
                    icon.classList.add('hidden');
                }
            });
        }
    </script>
</body></html>
