<body class="bg-background text-on-background min-h-screen flex flex-col items-center">
<div class="w-full max-w-md bg-surface min-h-screen flex flex-col shadow-sm">
<!-- Top App Bar -->
<header class="flex justify-center items-center px-margin-mobile w-full h-16 bg-surface top-0 z-10 sticky shadow-sm border-b border-surface-variant">
<div class="flex items-center justify-center h-full py-2">
<img alt="CERTEO Logo" class="h-full object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAcYIM86dfkpFf8tujgA-QIfAEW_2_n4UzmbVwEXfPHypb0QvVwYeTIlzVPlPvuWs1CV1GQHwCLD8j-sHYxrSJPUvBC1jvog_uRfdZLMPWvAABPBLs8B4G4M-rPc9vQ3JhJeyJNoyIRQAKUJxVfYRY7PCj3gucDF4VbF9zgDoHWdx5hWRIfe8bwU5v30ctXJubqp6nDatsad5pFL1N1npLYhw7p-KBbWzOPTAGnORMvLmmBGGa2NHyNQvHzOvYhwW0Vyg">
</div>
</header>
<!-- Main Content -->
<main class="flex-1 px-margin-mobile py-6 flex flex-col gap-6">
<!-- Header & Stepper -->
<div class="flex flex-col gap-4">
<div>
<span class="font-label-md text-label-md text-secondary uppercase tracking-wider">Étape 3 sur 4</span>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mt-1">Expérience &amp; CV</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-2">Partagez votre parcours et vos réalisations.</p>
</div>
<!-- Stepper Visual -->
<div class="flex gap-2 w-full mt-2">
<div class="h-2 flex-1 rounded-full bg-primary"></div>
<div class="h-2 flex-1 rounded-full bg-primary"></div>
<div class="h-2 flex-1 rounded-full bg-primary"></div>
<div class="h-2 flex-1 rounded-full bg-surface-container-high"></div>
</div>
</div>
<!-- Form -->
<form class="flex flex-col gap-6 flex-1">
<!-- Upload Zone -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface">Curriculum Vitae</label>
<div class="border-2 border-dashed border-outline-variant bg-surface-container-low rounded-xl p-8 flex flex-col items-center justify-center text-center gap-4 hover:border-primary hover:bg-surface-container transition-colors cursor-pointer group">
<div class="w-12 h-12 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined" data-icon="upload_file" style="font-variation-settings: 'FILL' 1;">upload_file</span>
</div>
<div>
<p class="font-body-md text-body-md text-on-surface"><span class="text-primary font-semibold">Cliquez pour ajouter</span> ou glissez-déposez</p>
<p class="font-label-md text-label-md text-secondary mt-1">PDF, DOCX, taille max. 5MB</p>
</div>
</div>
</div>
<!-- Portfolio Link -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="portfolio">Lien Portfolio / GitHub (Optionnel)</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-secondary" data-icon="link">link</span>
</div>
<input class="w-full pl-10 pr-4 py-3 rounded-lg border border-outline-variant bg-surface focus:border-primary focus:ring-1 focus:ring-primary font-body-md text-body-md text-on-surface outline-none transition-shadow" id="portfolio" placeholder="https://..." type="url">
</div>
</div>
<!-- Ordinateur Personnel Radio Buttons -->
<div class="flex flex-col gap-3">
<label class="font-label-md text-label-md text-on-surface">Avez-vous un ordinateur personnel ?</label>
<div class="flex gap-4">
<label class="flex items-center gap-2 cursor-pointer">
<input class="w-5 h-5 text-primary border-outline-variant focus:ring-primary focus:ring-offset-surface" name="ordinateur" type="radio" value="oui">
<span class="font-body-md text-body-md text-on-surface">Oui</span>
</label>
<label class="flex items-center gap-2 cursor-pointer">
<input class="w-5 h-5 text-primary border-outline-variant focus:ring-primary focus:ring-offset-surface" name="ordinateur" type="radio" value="non">
<span class="font-body-md text-body-md text-on-surface">Non</span>
</label>
</div>
</div>
<!-- Spacer to push buttons to bottom if needed -->
<div class="flex-1"></div>
<!-- Action Buttons -->
<div class="flex gap-4 mt-8 pt-4 border-t border-surface-variant">
<button class="flex-1 py-3 px-4 h-12 rounded-lg border border-primary text-primary font-label-md text-label-md hover:bg-surface-container active:scale-95 transition-all text-center flex items-center justify-center" type="button">
                        Précédent
                    </button>
<button class="flex-[2] py-3 px-4 h-12 rounded-lg bg-primary text-on-primary font-label-md text-label-md hover:opacity-90 active:scale-95 transition-all text-center flex items-center justify-center gap-2" type="button">
                        Suivant
                        <span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
