version: '3.8'

services:
  gateway:
    build:
      context: .
      dockerfile: backend/src/Certeo.Gateway/Dockerfile
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: backend/src/Certeo.Api/Dockerfile
    ports:
      - "5001:5001"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5001