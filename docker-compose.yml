version: '3.8'
services:
  gateway:
    build:
      context: .
      dockerfile: backend/src/Certeo.Gateway/Dockerfile
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: backend/src/Certeo.Api/Dockerfile
    ports:
      - "5001:5001"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5001
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=certeo_db;Username=certeo;Password=certeo
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: certeo-postgres
    environment:
      POSTGRES_USER: certeo
      POSTGRES_PASSWORD: certeo
      POSTGRES_DB: certeo_db
    ports:
      - "5432:5432"
    volumes:
      - certeo_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U certeo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  certeo_pg_data: